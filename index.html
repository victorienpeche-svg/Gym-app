<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Muscu Log — Haut du corps</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0e1013;
        --s1: #161a20;
        --s2: #1e242c;
        --s3: #262d37;
        --line: #2b333e;
        --text: #eef1f5;
        --mut: #9aa4b2;
        --acc: #c4f04a;
        --acc-ink: #10130a;
        --acc-soft: rgba(196, 240, 74, 0.14);
        --ok: #4ade80;
        --warn: #ffb454;
        --bad: #ff6b78;
        --blue: #6cb6ff;
        --r: 14px;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      [hidden] { display: none !important; }
      html { background: var(--bg); }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.45 Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        padding-bottom: calc(86px + env(safe-area-inset-bottom));
        -webkit-font-smoothing: antialiased;
      }
      h1, h2, h3 {
        font-family: "Barlow Condensed", Inter, sans-serif;
        font-weight: 700;
        letter-spacing: 0.02em;
        margin: 0;
        text-transform: uppercase;
      }
      h1 { font-size: 30px; }
      h2 { font-size: 21px; margin-bottom: 10px; }
      h3 { font-size: 18px; margin-bottom: 8px; }
      p { margin: 0 0 8px; }
      .mut { color: var(--mut); }
      .small { font-size: 13px; }
      .tiny { font-size: 12px; }
      .wrap { max-width: 720px; margin: 0 auto; padding: 16px 14px; }
      .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
      .top .sub { color: var(--mut); font-size: 13px; text-transform: capitalize; }
      .card { background: var(--s1); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; margin-bottom: 12px; }
      .card.hl {
        border-color: rgba(196, 240, 74, 0.45);
        background: linear-gradient(180deg, rgba(196, 240, 74, 0.08), var(--s1) 60%);
      }
      .row { display: flex; align-items: center; gap: 10px; }
      .between { justify-content: space-between; }
      .wrapx { flex-wrap: wrap; }
      .grow { flex: 1; min-width: 0; }
      .gap { height: 10px; }
      button { font: inherit; color: inherit; cursor: pointer; }
      .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        border: 1px solid var(--line); background: var(--s2); color: var(--text);
        padding: 10px 14px; border-radius: 11px; font-weight: 600; min-height: 42px;
      }
      .btn:hover { background: var(--s3); }
      .btn.primary { background: var(--acc); color: var(--acc-ink); border-color: var(--acc); }
      .btn.primary:hover { filter: brightness(1.07); }
      .btn.danger { color: var(--bad); border-color: rgba(255, 107, 120, 0.4); background: transparent; }
      .btn.ghost { background: transparent; }
      .btn.sm { padding: 6px 10px; min-height: 34px; font-size: 13px; border-radius: 9px; }
      .btn.block { width: 100%; }
      .btn:focus-visible, .chip:focus-visible, input:focus-visible, select:focus-visible,
      textarea:focus-visible, .cell:focus-visible, summary:focus-visible {
        outline: 2px solid var(--acc); outline-offset: 2px;
      }
      .chips { display: flex; flex-wrap: wrap; gap: 7px; }
      .chip {
        border: 1px solid var(--line); background: var(--s2); color: var(--text);
        padding: 7px 12px; border-radius: 999px; font-size: 13px; font-weight: 600;
      }
      .chip.on { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); }
      .chip.sq { min-width: 44px; text-align: center; border-radius: 10px; padding: 9px 0; }
      .tag {
        display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase;
        letter-spacing: 0.05em; padding: 2px 8px; border-radius: 999px; background: var(--s3); color: var(--mut);
      }
      .tag.acc { background: var(--acc-soft); color: var(--acc); }
      .tag.ok { background: rgba(74, 222, 128, 0.15); color: var(--ok); }
      .tag.bad { background: rgba(255, 107, 120, 0.15); color: var(--bad); }
      .tag.warn { background: rgba(255, 180, 84, 0.15); color: var(--warn); }
      .tag.blue { background: rgba(108, 182, 255, 0.15); color: var(--blue); }
      input, select, textarea {
        font: inherit; color: var(--text); background: var(--s2); border: 1px solid var(--line);
        border-radius: 10px; padding: 9px 10px; width: 100%; min-height: 42px;
      }
      textarea { min-height: 90px; resize: vertical; }
      .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
      .tile { background: var(--s1); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
      .tile b { display: block; font-family: "Barlow Condensed", sans-serif; font-size: 30px; line-height: 1.05; }
      .tile span { font-size: 12px; color: var(--mut); }
      .timebox { background: var(--s2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 10px 0; }
      .timebox .tval { font-family: "Barlow Condensed", sans-serif; font-size: 24px; font-weight: 700; color: var(--acc); line-height: 1; }
      .day {
        display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
        background: transparent; border: 0; border-top: 1px solid var(--line); padding: 10px 2px;
      }
      .day:first-child { border-top: 0; }
      .day.rest-fixed { opacity: 0.55; }
      .day .dn { width: 46px; font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 18px; text-transform: uppercase; color: var(--mut); }
      .day.today .dn { color: var(--acc); }
      .day .st { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; background: var(--s3); color: var(--mut); flex: none; }
      .day .st.done { background: var(--ok); color: #06210f; }
      .day .st.plan { background: var(--acc-soft); color: var(--acc); border: 1px solid var(--acc); }
      .day .st.blocked { background: rgba(255, 107, 120, 0.15); color: var(--bad); }
      .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
      .cal .h { text-align: center; font-size: 12px; color: var(--mut); padding: 4px 0; font-weight: 600; }
      .cell {
        min-height: 64px; background: var(--s1); border: 1px solid var(--line); border-radius: 10px;
        padding: 5px; text-align: left; display: flex; flex-direction: column; gap: 2px; color: var(--text); min-width: 0;
      }
      .cell .n { font-size: 12px; font-weight: 600; color: var(--mut); }
      .cell .l { font-size: 11px; font-weight: 700; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .cell.other { opacity: 0.35; }
      .cell.rest-fixed { background: #121519; opacity: 0.65; }
      .cell.today { border-color: var(--text); }
      .cell.today .n { color: var(--text); }
      .cell.plan { background: var(--acc-soft); border-color: rgba(196, 240, 74, 0.5); }
      .cell.plan .l { color: var(--acc); }
      .cell.done { background: rgba(74, 222, 128, 0.14); border-color: rgba(74, 222, 128, 0.5); }
      .cell.done .l { color: var(--ok); }
      .cell.blocked {
        background: repeating-linear-gradient(45deg, rgba(255, 107, 120, 0.12) 0 6px, transparent 6px 12px);
        border-color: rgba(255, 107, 120, 0.45);
      }
      .cell.blocked .l { color: var(--bad); }
      .cell.missed .l { color: var(--warn); }
      .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--mut); margin-top: 10px; }
      .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
      .mhead {
        display: flex; align-items: center; justify-content: space-between; margin: 14px 0 8px;
        padding: 6px 10px; background: var(--s2); border-left: 3px solid var(--acc); border-radius: 8px;
      }
      .mhead b { font-family: "Barlow Condensed", sans-serif; font-size: 18px; letter-spacing: 0.03em; text-transform: uppercase; }
      .ex { background: var(--s1); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; margin-bottom: 10px; }
      .ex h3 { margin: 0; }
      .sets { display: grid; grid-template-columns: 28px 1fr 1fr 44px; gap: 8px; align-items: center; margin-top: 10px; }
      .sets .hd { font-size: 11px; color: var(--mut); text-transform: uppercase; letter-spacing: 0.05em; }
      .sets .sn { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 18px; color: var(--mut); text-align: center; }
      .sets input { text-align: center; font-weight: 600; font-size: 16px; }
      .sets input.dn { background: rgba(74, 222, 128, 0.12); border-color: rgba(74, 222, 128, 0.5); }
      .ck { width: 44px; height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--s2); display: grid; place-items: center; font-size: 18px; color: var(--mut); }
      .ck.on { background: var(--ok); border-color: var(--ok); color: #06210f; }
      .hint { font-size: 12.5px; color: var(--mut); margin-top: 6px; }
      .hint b { color: var(--acc); font-weight: 600; }
      .prev { font-size: 12px; color: var(--mut); }
      .sugg { font-size: 13px; margin-top: 4px; color: var(--acc); }
      #timer { position: fixed; left: 0; right: 0; bottom: calc(64px + env(safe-area-inset-bottom)); z-index: 30; padding: 0 10px 8px; pointer-events: none; }
      #timer .in {
        pointer-events: auto; max-width: 700px; margin: 0 auto; background: var(--s3);
        border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5); display: flex; align-items: center; gap: 10px;
        position: relative; overflow: hidden;
      }
      #timer.fin .in { background: var(--acc); color: var(--acc-ink); border-color: var(--acc); }
      #timer .bar { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--acc); width: 0; transition: width 0.25s linear; }
      #timer.fin .bar { display: none; }
      #timer .t { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 36px; line-height: 1; min-width: 84px; }
      #timer .lb { font-size: 12px; opacity: 0.8; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #timer .btn { padding: 6px 10px; min-height: 36px; }
      #timer.fin .btn { background: rgba(0, 0, 0, 0.12); border-color: rgba(0, 0, 0, 0.2); color: var(--acc-ink); }
      nav {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: rgba(14, 16, 19, 0.94);
        backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom);
      }
      nav .in { display: flex; max-width: 720px; margin: 0 auto; }
      nav button {
        flex: 1; background: none; border: 0; padding: 9px 0 8px; color: var(--mut); display: flex;
        flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 600;
        min-height: 64px; justify-content: center;
      }
      nav button svg { width: 23px; height: 23px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      nav button.on { color: var(--acc); }
      #modal { position: fixed; inset: 0; z-index: 60; background: rgba(0, 0, 0, 0.6); display: flex; align-items: flex-end; justify-content: center; }
      #modal .sheet {
        background: var(--s1); border: 1px solid var(--line); border-radius: 20px 20px 0 0; width: 100%;
        max-width: 720px; max-height: 88vh; overflow: auto; padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
      }
      @media (min-width: 700px) {
        #modal { align-items: center; }
        #modal .sheet { border-radius: 20px; }
      }
      .toast {
        position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(150px + env(safe-area-inset-bottom));
        background: var(--text); color: #111; padding: 10px 16px; border-radius: 12px; font-weight: 600;
        font-size: 14px; z-index: 80; max-width: 92vw; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      }
      .chart { width: 100%; height: auto; display: block; }
      .chart text { fill: var(--mut); font-size: 11px; font-family: Inter, sans-serif; }
      .seg { display: flex; background: var(--s2); border-radius: 11px; padding: 3px; gap: 3px; }
      .seg button { flex: 1; background: none; border: 0; border-radius: 8px; padding: 7px 4px; font-size: 13px; font-weight: 600; color: var(--mut); }
      .seg button.on { background: var(--s3); color: var(--text); }
      details { border-top: 1px solid var(--line); padding: 9px 0; }
      summary { cursor: pointer; font-weight: 600; list-style: none; }
      summary::-webkit-details-marker { display: none; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      td, th { text-align: left; padding: 5px 4px; border-bottom: 1px solid var(--line); }
      th { color: var(--mut); font-weight: 600; font-size: 12px; }
      label.l { display: block; font-size: 12px; color: var(--mut); margin: 12px 0 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
      .exrow { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); }
      .exrow:first-child { border-top: 0; }
      @media (max-width: 400px) {
        .cell { min-height: 58px; padding: 4px; }
        .cell .l { font-size: 10px; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="timer" hidden>
      <div class="in">
        <div class="t" id="tt">0:00</div>
        <div class="grow"><div class="lb" id="tl">Repos</div></div>
        <button class="btn sm" data-act="tAdj" data-d="-15" aria-label="Moins 15 secondes">−15</button>
        <button class="btn sm" data-act="tAdj" data-d="15" aria-label="Plus 15 secondes">+15</button>
        <button class="btn sm" data-act="tStop" id="tstop">Passer</button>
        <div class="bar" id="tbar"></div>
      </div>
    </div>

    <nav aria-label="Navigation principale">
      <div class="in">
        <button data-act="tab" data-t="home" id="n-home">
          <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8" /><path d="M5 10v10h5v-6h4v6h5V10" /></svg>Accueil
        </button>
        <button data-act="tab" data-t="cal" id="n-cal">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3" /><path d="M8 3v4M16 3v4M3 10h18" /></svg>Calendrier
        </button>
        <button data-act="tab" data-t="workout" id="n-workout">
          <svg viewBox="0 0 24 24"><path d="M6 8v8M3 10v4M18 8v8M21 10v4M6 12h12" /></svg>Séance
        </button>
        <button data-act="tab" data-t="progress" id="n-progress">
          <svg viewBox="0 0 24 24"><path d="M3 20h18M5 16l4-5 4 3 6-8" /></svg>Progrès
        </button>
        <button data-act="tab" data-t="settings" id="n-settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2" /></svg>Réglages
        </button>
      </div>
    </nav>
    <div id="modal" hidden data-act="bg">
      <div class="sheet" id="sheet"></div>
    </div>

    <script>
      /* ============ Utilitaires ============ */
      const $ = (s, el = document) => el.querySelector(s);
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
        );
      const pad = (n) => String(n).padStart(2, "0");
      const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      const parse = (s) => {
        const [y, m, d] = s.split("-").map(Number);
        return new Date(y, m - 1, d);
      };
      const addDays = (d, n) => {
        const x = new Date(d);
        x.setDate(x.getDate() + n);
        return x;
      };
      const monday = (d) => {
        const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
        x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
        return x;
      };
      const today = () => ymd(new Date());
      const wkOf = (s) => ymd(monday(parse(s)));
      const num = (v) => {
        const n = parseFloat(String(v ?? "").replace(",", "."));
        return isFinite(n) ? n : 0;
      };
      const nf = (v) => String(Math.round(v * 100) / 100).replace(".", ",");
      const mmss = (s) => {
        s = Math.max(0, Math.round(s));
        return Math.floor(s / 60) + ":" + pad(s % 60);
      };
      const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
      const fmtDay = (d) =>
        cap(parse(d).toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" }));
      const fmtShort = (d) => parse(d).toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
      const DN = ["Lun", "Mar", "Mer", "Jeu", "Ven", "Sam", "Dim"];
      const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);

      /* ============ Données : Haut du corps uniquement (5 muscles) ============ */
      const MUSCLES = ["pecs", "dos", "epaules", "biceps", "triceps"];
      const MFR = { pecs: "Pectoraux", dos: "Dos", epaules: "Épaules", biceps: "Biceps", triceps: "Triceps" };
      const MSHORT = { pecs: "Pecs", dos: "Dos", epaules: "Épaules", biceps: "Biceps", triceps: "Triceps" };

      /* ============ PROFILS PAR MUSCLE (modifiable ici) ============
         sets : nombre de séries pour l'exo n°1, n°2, n°3 du muscle
         reps : fourchette [min,max] selon l'objectif ; c = polyarticulaire, i = isolation
         - Gros muscles (pecs, dos)  : 2 exos × 3 séries, 8-10 reps (poly)
         - Épaules                   : 2 exos × 3 séries, reps un peu plus hautes
         - Petits muscles (bras)     : 3 puis 2 séries, 10-15 reps (récupèrent vite, déjà sollicités par pecs/dos)
      */
      const GROS = {
        size: "gros",
        label: "Gros muscle",
        sets: [3, 3, 3],
        reps: {
          hyper: { c: [8, 10], i: [10, 12] },
          force: { c: [4, 6], i: [6, 8] },
          endu: { c: [12, 15], i: [15, 20] },
        },
      };
      const MOYEN = {
        size: "moyen",
        label: "Muscle moyen",
        sets: [3, 3, 3],
        reps: {
          hyper: { c: [8, 12], i: [12, 15] },
          force: { c: [5, 8], i: [8, 12] },
          endu: { c: [12, 15], i: [15, 20] },
        },
      };
      const PETIT = {
        size: "petit",
        label: "Petit muscle",
        sets: [3, 2, 2],
        reps: {
          hyper: { c: [10, 12], i: [10, 15] },
          force: { c: [6, 8], i: [8, 12] },
          endu: { c: [12, 15], i: [15, 20] },
        },
      };
      const PROFILE = { pecs: GROS, dos: GROS, epaules: MOYEN, biceps: PETIT, triceps: PETIT };

      const setsFor = (m, rank = 0) => {
        const a = (PROFILE[m] || GROS).sets;
        return a[Math.min(rank || 0, a.length - 1)];
      };
      const repsFor = (e, goal) => {
        const p = (PROFILE[e.m] || GROS).reps[goal || "hyper"] || (PROFILE[e.m] || GROS).reps.hyper;
        return (e.t === "c" ? p.c : p.i).slice();
      };
      const totalSetsOf = (exs) => exs.reduce((a, x) => a + (x.sets ? x.sets.length : 0), 0);
      const repsTxt = (r) => r[0] + "-" + r[1];

      const EX = [
        /* Pectoraux */
        { id: "dc-barre", n: "Développé couché barre", m: "pecs", t: "c", inc: 2.5 },
        { id: "dincl-halt", n: "Développé incliné haltères", m: "pecs", t: "c", inc: 2 },
        { id: "dc-halt", n: "Développé couché haltères", m: "pecs", t: "c", inc: 2 },
        { id: "dc-machine", n: "Développé machine convergente", m: "pecs", t: "c", inc: 2.5 },
        { id: "dincl-barre", n: "Développé incliné barre", m: "pecs", t: "c", inc: 2.5 },
        { id: "dips", n: "Dips (pectoraux)", m: "pecs", t: "c", bw: 1, inc: 2.5 },
        { id: "pec-deck", n: "Pec deck (écarté machine)", m: "pecs", t: "i", inc: 2.5 },
        { id: "ecarte-pou", n: "Écarté poulie vis-à-vis", m: "pecs", t: "i", inc: 2.5 },
        { id: "ecarte-halt", n: "Écarté haltères incliné", m: "pecs", t: "i", inc: 1 },
        { id: "pompes", n: "Pompes lestées / pieds surélevés", m: "pecs", t: "c", bw: 1, inc: 2.5 },
        /* Dos */
        { id: "tractions", n: "Tractions", m: "dos", t: "c", bw: 1, inc: 2.5 },
        { id: "tirage-vert", n: "Tirage vertical poulie haute", m: "dos", t: "c", inc: 2.5 },
        { id: "rowing-barre", n: "Rowing barre buste penché", m: "dos", t: "c", inc: 2.5 },
        { id: "rowing-halt", n: "Rowing haltère un bras", m: "dos", t: "c", inc: 2 },
        { id: "tirage-hor", n: "Tirage horizontal poulie basse", m: "dos", t: "c", inc: 2.5 },
        { id: "rowing-mach", n: "Rowing machine poitrine appuyée", m: "dos", t: "c", inc: 2.5 },

        { id: "dips-tri", n: "Dips (triceps buste droit)", m: "triceps", t: "c", bw: 1, inc: 2.5 },

        { id: "ext-nuque", n: "Extension triceps haltère nuque", m: "triceps", t: "i", inc: 2 },
        { id: "kickback-tri", n: "Kickback triceps poulie / haltère", m: "triceps", t: "i", inc: 1 },
      ];
      const EXI = Object.fromEntries(EX.map((e) => [e.id, e]));

      /* ============ Paires de 2 muscles par séance ============ */
      const PAIRS = {
        pecsTri: { key: "pecsTri", name: "Pecs & Triceps", short: "Pecs/Tri", muscles: ["pecs", "triceps"] },
        dosBi: { key: "dosBi", name: "Dos & Biceps", short: "Dos/Bi", muscles: ["dos", "biceps"] },
        epPecs: { key: "epPecs", name: "Épaules & Pecs", short: "Ép/Pecs", muscles: ["epaules", "pecs"] },
        dosEp: { key: "dosEp", name: "Dos & Épaules", short: "Dos/Ép", muscles: ["dos", "epaules"] },
        epTri: { key: "epTri", name: "Épaules & Triceps", short: "Ép/Tri", muscles: ["epaules", "triceps"] },
        epBi: { key: "epBi", name: "Épaules & Biceps", short: "Ép/Bi", muscles: ["epaules", "biceps"] },
        pecsDos: { key: "pecsDos", name: "Pecs & Dos", short: "Pecs/Dos", muscles: ["pecs", "dos"] },
        biTri: { key: "biTri", name: "Biceps & Triceps", short: "Bras", muscles: ["biceps", "triceps"] },
        pecsBi: { key: "pecsBi", name: "Pecs & Biceps", short: "Pecs/Bi", muscles: ["pecs", "biceps"] },
        dosTri: { key: "dosTri", name: "Dos & Triceps", short: "Dos/Tri", muscles: ["dos", "triceps"] },
      };
      const PAIR_LIST = Object.values(PAIRS);

      /* ============ Adaptation au temps (2 ou 3 exos/muscle, séries selon le muscle) ============ */
      const DURATIONS = [35, 40, 45, 50, 60, 75, 90];

      function timePlan(mins, goal = "hyper", exMode = "auto", ms = null) {
        mins = Math.max(30, Math.min(120, Number(mins) || 60));
        let c1 = 2,
          c2 = 2;
        if (exMode === "2") {
          c1 = 2;
          c2 = 2;
        } else if (exMode === "3") {
          c1 = 3;
          c2 = 3;
        } else {
          if (mins <= 50) {
            c1 = 2;
            c2 = 2;
          } else if (mins <= 65) {
            c1 = 3;
            c2 = 2;
          } else {
            c1 = 3;
            c2 = 3;
          }
        }
        const m1 = ms ? ms[0] : null,
          m2 = ms ? ms[1] : null;
        const sumSets = (m, c) => {
          let t = 0;
          for (let i = 0; i < c; i++) t += m ? setsFor(m, i) : 3;
          return t;
        };
        const totalSets = sumSets(m1, c1) + sumSets(m2, c2);
        const totalEx = c1 + c2;
        const avgSets = totalSets / totalEx;
        const perExBudget = mins / totalEx;
        const rawRest = Math.round(((perExBudget - (1.5 + avgSets * 0.65)) * 60) / Math.max(1, avgSets - 1));
        const minRest = goal === "force" ? 75 : 50;
        const maxRest = goal === "force" ? 165 : goal === "endu" ? 90 : 135;
        const baseRest = Math.max(minRest, Math.min(maxRest, Math.round(rawRest / 15) * 15));
        const compRest = Math.min(maxRest, baseRest + 15);
        const isoRest = Math.max(minRest, baseRest - 15);
        return { mins, c1, c2, totalEx, totalSets, baseRest, compRest, isoRest };
      }

      function estimateMinutes(exercises) {
        if (!exercises || !exercises.length) return 0;
        const total = exercises.reduce((acc, ex) => {
          const sets = ex.sets ? ex.sets.length : 3;
          const work = sets * 0.65;
          const rest = Math.max(0, sets - 1) * ((ex.rest || 90) / 60);
          return acc + 1.5 + work + rest;
        }, 0);
        return Math.round(total);
      }

      const buildItems = (items) => items.map((i) => buildEx(i.e, i.orig, i.tp, i.rank));

      /* ============ Construction des séances de la semaine (2 muscles / séance) ============ */
      function splitKeys(n, split, prio) {
        const seqs = {
          auto: ["pecsTri", "dosBi", "epPecs", "dosEp", "biTri", "pecsDos"],
          synergie: ["pecsTri", "dosBi", "epBi", "pecsTri", "dosBi", "epTri"],
          antagoniste: ["pecsDos", "biTri", "dosEp", "pecsDos", "biTri", "epPecs"],
        };
        let base = (seqs[split] || seqs.auto).slice();
        if (prio && prio.length) {
          const score = (k) => PAIRS[k].muscles.reduce((s, m) => s + (prio.includes(m) ? 10 : 0), 0);
          const allKeys = Object.keys(PAIRS);
          const ranked = [...new Set([...base, ...allKeys])].sort((a, b) => score(b) - score(a));
          const picked = [];
          for (let i = 0; i < n; i++) {
            const cand = ranked.find((k) => !picked.includes(k)) || ranked[i % ranked.length];
            picked.push(cand);
          }
          return picked;
        }
        return Array.from({ length: n }, (_, i) => base[i % base.length]);
      }

      function buildSlots(n, prio, mins) {
        const keys = splitKeys(n, S.settings.split, prio);
        const tp0 = timePlan(mins, S.settings.goal, S.settings.exPerMuscle);
        const occ = {};
        return keys.map((k, i) => {
          occ[k] = occ[k] || 0;
          const p = PAIRS[k];
          let [m1, m2] = p.muscles;
          if (prio && prio.includes(m2) && !prio.includes(m1) && tp0.c1 > tp0.c2) {
            [m1, m2] = [m2, m1];
          }
          const tp = timePlan(mins, S.settings.goal, S.settings.exPerMuscle, [m1, m2]);
          return {
            idx: i,
            key: k,
            name: `${MFR[m1]} & ${MFR[m2]}`,
            short: `${MSHORT[m1]}/${MSHORT[m2]}`,
            occ: occ[k]++,
            muscles: [m1, m2],
            blocks: [
              { m: m1, count: tp.c1 },
              { m: m2, count: tp.c2 },
            ],
            sub: `${MFR[m1]} (${tp.c1} exos) · ${MFR[m2]} (${tp.c2} exos) · ${tp.totalSets} séries`,
            tp,
          };
        });
      }

      function pickForMuscle(m, count, seed) {
        const pool = EX.filter((e) => e.m === m);
        const rot = (a, s) => (a.length ? a.slice(s % a.length).concat(a.slice(0, s % a.length)) : a);
        const comps = rot(pool.filter((e) => e.t === "c"), seed);
        const isos = rot(pool.filter((e) => e.t === "i"), seed);
        let out = [];
        if (comps.length) {
          const nc = Math.min(comps.length, count === 3 ? 2 : 1);
          out = comps.slice(0, nc);
        }
        const rem = count - out.length;
        out = out.concat(isos.slice(0, rem));
        if (out.length < count) {
          for (const e of comps.concat(isos)) {
            if (out.length < count && !out.includes(e)) out.push(e);
          }
        }
        return out;
      }

      function exercisesFor(muscles, tp, seed) {
        const counts = [tp.c1, tp.c2];
        const items = [];
        const seen = new Set();
        muscles.forEach((m, idx) => {
          const cnt = counts[idx] || 2;
          let rank = 0;
          pickForMuscle(m, cnt, seed).forEach((e) => {
            let ex = e;
            const sw = S.swaps[e.id];
            if (sw && EXI[sw] && EXI[sw].m === m && !seen.has(sw)) ex = EXI[sw];
            if (seen.has(ex.id)) return;
            seen.add(ex.id);
            items.push({ e: ex, orig: e.id, tp, rank: rank++ });
          });
        });
        return items;
      }

      function slotExercises(slot, customMins) {
        const mins = customMins || slot.tp?.mins || S.settings.duration;
        const tp = timePlan(mins, S.settings.goal, S.settings.exPerMuscle, slot.muscles);
        return exercisesFor(slot.muscles, tp, slot.occ);
      }

      function customPairExercises(m1, m2, mins) {
        const tp = timePlan(mins, S.settings.goal, S.settings.exPerMuscle, [m1, m2]);
        return exercisesFor([m1, m2], tp, 0);
      }

      /* ============ État ============ */
      const KEY = "muscu-log-upper-v2";
      function fresh() {

      const ui = {
        tab: "home",

        progEx: null,

      /* ============ Planification hebdomadaire ============ */
      function pickDays(n, pref, strict = true) {
        pref = [...pref].sort((a, b) => a - b);
        if (!pref.length) pref = [0, 2, 4];
        if (n <= pref.length) {
          if (n === pref.length) return pref;
          if (n === 1) return [pref[Math.floor(pref.length / 2)]];
          return [
            ...new Set(
              Array.from({ length: n }, (_, i) => pref[Math.round((i * (pref.length - 1)) / (n - 1))])
            ),
          ];
        }
        if (strict) return pref;
        const out = [...pref];
        while (out.length < n) {
          let best = -1,
            bd = -1;
          for (let d = 0; d < 7; d++) {
            if (out.includes(d)) continue;
            const md = Math.min(...out.map((x) => Math.abs(x - d)));
            if (md > bd) {
              bd = md;
              best = d;
            }
          }
          out.push(best);
        }
        return out.sort((a, b) => a - b);
      }

      function planWeek(wk) {
        const strict = S.settings.strictDays !== false;
        const prefDays = [...S.settings.gymDays].sort((a, b) => a - b);
        const rawN = S.weekN[wk] ?? prefDays.length;
        const n = strict ? Math.min(rawN, prefDays.length) : rawN;
        const dur = S.weekDur[wk] ?? S.settings.duration;
        const prio = S.weekPrio[wk] ?? S.settings.priority;
        const slots = buildSlots(n, prio, dur);
        const mon = parse(wk),
          t = today();
        const days = Array.from({ length: 7 }, (_, i) => ymd(addDays(mon, i)));
        const info = {};
        days.forEach(
          (d, i) =>
            (info[d] = {
              date: d,
              logs: [],
              slot: null,
              customPair: null,
              pinned: false,
              blocked: S.blocked[d] || null,
              defaultRest: !prefDays.includes(i),
              missed: false,
            })
        );
        S.logs.forEach((l) => {
          if (info[l.date]) info[l.date].logs.push(l);
        });
        const doneSlots = new Set(
          S.logs.filter((l) => l.weekKey === wk && l.slot != null && l.slot < slots.length).map((l) => l.slot)
        );
        const pinned = new Set();
        days.forEach((d) => {
          if (d < t || info[d].blocked || info[d].logs.length) return;
          if (S.customPins[d]) {
            info[d].customPair = S.customPins[d];
            info[d].pinned = true;
            return;
          }
          const p = S.pins[d];
          if (p == null || p >= slots.length || doneSlots.has(p) || pinned.has(p)) return;
          info[d].slot = p;
          info[d].pinned = true;
          pinned.add(p);
        });
        const remaining = slots.map((s) => s.idx).filter((i) => !doneSlots.has(i) && !pinned.has(i));
        const pref = new Set(pickDays(n, prefDays, strict));

        let pool = days.filter(
          (d, i) =>
            d >= t &&
            !info[d].blocked &&
            !info[d].logs.length &&
            info[d].slot == null &&
            !info[d].customPair &&
            (!strict || prefDays.includes(i))
        );

        const taken = days
          .map((d, i) => (info[d].logs.length || info[d].slot != null || info[d].customPair ? i : -1))
          .filter((i) => i >= 0);
        const chosen = pool.filter((d) => pref.has(days.indexOf(d))).slice(0, remaining.length);
        pool = pool.filter((d) => !chosen.includes(d));
        while (chosen.length < remaining.length && pool.length) {
          const occ = [...taken, ...chosen.map((d) => days.indexOf(d))];
          let best = null,
            bs = -1;
          pool.forEach((d) => {
            const i = days.indexOf(d);
            const md = occ.length ? Math.min(...occ.map((o) => Math.abs(o - i))) : 9;
            if (md > bs) {
              bs = md;
              best = d;
            }
          });
          chosen.push(best);
          pool = pool.filter((d) => d !== best);
        }
        chosen.sort();
        remaining.forEach((si, k) => {
          if (chosen[k]) info[chosen[k]].slot = si;
        });
        const unplaced = remaining.slice(chosen.length);
        days.forEach((d, i) => {
          if (pref.has(i) && d < t && d >= S.created && !info[d].blocked && !info[d].logs.length)
            info[d].missed = true;
        });
        return { wk, n, dur, prio, slots, info, days, unplaced, done: doneSlots.size, pref, strict };
      }

      /* ============ Prescription (séries & reps selon le muscle) & progression ============ */
      function prescribe(e, tp, rank = 0) {
        const g = S.settings.goal,
          c = e.t === "c";
        const reps = repsFor(e, g);
        const sets = setsFor(e.m, rank);
        const rest = tp
          ? c
            ? tp.compRest
            : tp.isoRest
          : g === "force"
          ? c
            ? 150
            : 90
          : g === "endu"
          ? c
            ? 60
            : 45
          : c
          ? 105
          : 75;
        return { sets, reps, rest };
      }

      function lastPerf(id) {
        const ls = [...S.logs].sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
        for (let i = ls.length - 1; i >= 0; i--) {
          const x = ls[i].exercises.find((x) => x.id === id);
          if (x && x.sets.length) return { date: ls[i].date, sets: x.sets };
        }
        return null;
      }

      function suggest(e, p) {
        const lp = lastPerf(e.id);
        if (!lp)
          return {
            w: e.bw ? 0 : null,
            note: e.bw
              ? `Première fois : commence au poids du corps (${p.sets} séries)`
              : `Première fois : choisis une charge maîtrisée sur ${p.sets} séries (2 reps en réserve).`,
          };
        const w = Math.max(...lp.sets.map((s) => s.w));
        const top = lp.sets.filter((s) => s.w === w);
        const hit = lp.sets.length >= p.sets && lp.sets.slice(0, p.sets).every((s) => s.r >= p.reps[1]);
        if (hit) {
          const nw = Math.round((w + (e.inc || 2.5)) * 4) / 4;
          return {
            w: nw,
            note: `${p.sets} séries à ${p.reps[1]} reps validées à ${nf(w)} kg → monte à ${nf(nw)} kg` + (e.bw ? " (lest)" : ""),
          };
        }
        const bestR = Math.max(...top.map((s) => s.r));
        return {
          w,
          note: `Garde ${nf(w)} kg${e.bw ? " (lest)" : ""} et vise ${Math.min(p.reps[1], bestR + 1)}+ reps sur tes ${p.sets} séries`,
        };
      }

      function buildEx(e, orig, tp, rank = 0) {
        const p = prescribe(e, tp, rank);
        const sg = suggest(e, p);
        return {
          id: e.id,
          orig: orig || e.id,
          name: e.n,
          m: e.m,
          t: e.t,
          bw: !!e.bw,
          inc: e.inc || 2.5,
          rank,
          reps: p.reps,
          rest: p.rest,
          suggest: sg,
          sets: Array.from({ length: p.sets }, () => ({
            w: sg.w != null ? String(sg.w) : "",
            r: "",
            done: false,
          })),
        };
      }

      function startWorkout(name, muscles, items, slot, date, wk, targetDur) {
        const dur = targetDur || S.dayDur[date] || S.weekDur[wk] || S.settings.duration;
        S.active = {
          id: uid(),
          date,
          weekKey: wk,
          slot,
          name,
          muscles,
          targetDur: dur,
          startedAt: Date.now(),
          exercises: buildItems(items),
        };
        save();
        ui.tab = "workout";
        render();
        window.scrollTo(0, 0);
        try {
          navigator.wakeLock && navigator.wakeLock.request("screen").catch(() => {});
        } catch (e) {}
      }

      function startSlot(wk, idx, dateOverride) {
        const P = planWeek(wk);
        const s = P.slots[idx];
        if (!s) return;
        const d = dateOverride || today();
        const dur = S.dayDur[d] || P.dur;
        startWorkout(s.name, s.muscles, slotExercises(s, dur), idx, d, wk, dur);
      }

      function startCustomPair(m1, m2, dur, dateOverride, wkOverride) {
        const d = dateOverride || today();
        const wk = wkOverride || wkOf(d);
        const mins = dur || S.dayDur[d] || S.weekDur[wk] || S.settings.duration;
        const items = customPairExercises(m1, m2, mins);
        startWorkout(`${MFR[m1]} & ${MFR[m2]}`, [m1, m2], items, null, d, wk, mins);
      }

      function adaptActiveDuration(newMins) {
        if (!S.active) return;
        newMins = Math.max(30, Math.min(120, Number(newMins) || 60));
        const [m1, m2] = S.active.muscles || [...new Set(S.active.exercises.map((x) => x.m))];
        const tp = timePlan(newMins, S.settings.goal, S.settings.exPerMuscle, [m1, m2]);
        const counts = { [m1]: tp.c1, [m2]: tp.c2 };
        const next = [];
        [m1, m2].forEach((m) => {
          if (!m) return;
          const targetCnt = counts[m] || 2;
          let cur = S.active.exercises.filter((x) => x.m === m);
          if (cur.length > targetCnt) {
            const started = cur.filter((x) => x.sets.some((s) => s.done));
            const unstarted = cur.filter((x) => !x.sets.some((s) => s.done));
            cur = started.concat(unstarted).slice(0, Math.max(targetCnt, started.length));
          } else if (cur.length < targetCnt) {
            const used = new Set(S.active.exercises.map((x) => x.id));
            const extra = pickForMuscle(m, targetCnt + 2, 0)
              .filter((e) => !used.has(e.id))
              .slice(0, targetCnt - cur.length);
            extra.forEach((e) => cur.push(buildEx(e, e.id, tp, cur.length)));
          }
          cur.forEach((x) => {
            const exMeta = EXI[x.id] || { t: "c" };
            x.rest = exMeta.t === "c" ? tp.compRest : tp.isoRest;
            next.push(x);
          });
        });
        S.active.exercises = next;
        S.active.targetDur = newMins;
        save();
        toast(`Séance adaptée pour ${newMins} min (${next.length} exos · ${totalSetsOf(next)} séries)`);
        render();
      }

      /* ============ Minuteur ============ */
      let actx = null;
      function audio() {
        try {
          if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
          if (actx.state === "suspended") actx.resume();
        } catch (e) {}
      }
      function beep() {
        try {
          audio();
          if (!actx) return;
          [0, 0.25, 0.5].forEach((t, i) => {
            const o = actx.createOscillator(),
              g = actx.createGain();
            o.frequency.value = i === 2 ? 1175 : 880;
            o.connect(g);
            g.connect(actx.destination);
            const st = actx.currentTime + t;
            g.gain.setValueAtTime(0.0001, st);
            g.gain.exponentialRampToValueAtTime(0.4, st + 0.02);
            g.gain.exponentialRampToValueAtTime(0.0001, st + 0.2);
            o.start(st);
            o.stop(st + 0.22);
          });
          navigator.vibrate && navigator.vibrate([200, 100, 200]);
        } catch (e) {}
      }
      function startTimer(sec, label) {
        audio();
        S.timer = { end: Date.now() + sec * 1000, total: sec, label, fired: false };
        save();
        tick();
      }
      function tick() {
        const el = $("#timer");
        if (S.timer) {
          const left = (S.timer.end - Date.now()) / 1000;
          el.hidden = false;
          if (left <= 0) {
            if (!S.timer.fired) {
              S.timer.fired = true;
              save();
              beep();
            }
            el.classList.add("fin");
            $("#tt").textContent = "GO !";
            $("#tl").textContent = "Repos terminé — série suivante";
            $("#tstop").textContent = "OK";
          } else {
            el.classList.remove("fin");
            $("#tt").textContent = mmss(left);
            $("#tl").textContent = S.timer.label;
            $("#tstop").textContent = "Passer";
            $("#tbar").style.width = Math.min(100, (1 - left / S.timer.total) * 100) + "%";
          }
        } else el.hidden = true;
        const e = $("#elapsed");
        if (e && S.active) e.textContent = mmss((Date.now() - S.active.startedAt) / 1000);
      }
      setInterval(tick, 250);

      /* ============ UI helpers ============ */
      let toastT = null;
      function toast(m) {
        let t = $(".toast");
        if (t) t.remove();
        t = document.createElement("div");
        t.className = "toast";
        t.setAttribute("role", "status");
        t.textContent = m;
        document.body.appendChild(t);
        clearTimeout(toastT);
        toastT = setTimeout(() => t.remove(), 3600);
      }
      function modal(html) {
        $("#sheet").innerHTML = html;
        $("#modal").hidden = false;
      }
      function closeModal() {
        $("#modal").hidden = true;
        $("#sheet").innerHTML = "";
        ui.modalWeek = null;
      }
      function confirmM(msg, act, data = {}) {
        const attrs = Object.entries(data)
          .map(([k, v]) => `data-${k}="${esc(v)}"`)
          .join(" ");
        modal(
          `<h3>Confirmer</h3><p>${msg}</p><div class="row" style="margin-top:14px"><button class="btn grow" data-act="close">Annuler</button><button class="btn primary grow" data-act="${act}" ${attrs}>Confirmer</button></div>`
        );
      }
      const chip = (on, act, data, label, cls = "") =>
        `<button class="chip ${cls} ${on ? "on" : ""}" data-act="${act}" ${Object.entries(data || {})
          .map(([k, v]) => `data-${k}="${esc(v)}"`)
          .join(" ")} aria-pressed="${!!on}">${label}</button>`;

      /* Tableau récapitulatif des profils par muscle */
      function profileTable() {
        const g = S.settings.goal;
        return `<table>
          <tr><th>Muscle</th><th>Séries (exo 1 / 2 / 3)</th><th>Reps poly.</th><th>Reps iso.</th></tr>
          ${MUSCLES.map((m) => {
            const p = PROFILE[m];
            return `<tr>
              <td><b>${esc(MFR[m])}</b><br><span class="tiny mut">${esc(p.label)}</span></td>
              <td>${p.sets.join(" / ")}</td>
              <td>${repsTxt(p.reps[g].c)}</td>
              <td>${repsTxt(p.reps[g].i)}</td>
            </tr>`;
          }).join("")}
        </table>`;
      }

      /* ============ Stats ============ */
      function vol(l) {
        return l.exercises.reduce((a, x) => a + x.sets.reduce((b, s) => b + s.w * s.r, 0), 0);
      }
      function stats() {
        const t = today(),
          m = t.slice(0, 7),
          wk = wkOf(t);
        const month = S.logs.filter((l) => l.date.startsWith(m)).length;
        const wvol = S.logs.filter((l) => l.weekKey === wk).reduce((a, l) => a + vol(l), 0);
        const weeks = new Set(S.logs.map((l) => l.weekKey));
        let streak = 0,
          c = monday(new Date());
        if (!weeks.has(ymd(c))) c = addDays(c, -7);
        while (weeks.has(ymd(c))) {
          streak++;
          c = addDays(c, -7);
        }
        return { month, wvol, streak, total: S.logs.length };
      }

      /* ============ Onboarding ============ */
      function renderOnboarding() {
        const gd = S.settings.gymDays;
        const dur = S.settings.duration;
        const pr = S.settings.priority;
        const g = S.settings.goal;
        const offDays = DN.filter((_, i) => !gd.includes(i));
        const tpx = timePlan(dur, g, "auto");
        return `<div class="wrap">
    <div style="padding:10px 0 6px">
      <span class="tag acc">Haut du corps · 2 muscles / séance</span>
      <h1 style="margin-top:8px">Configuration rapide</h1>
      <p class="mut">Chaque séance travaille 2 muscles. Le nombre de séries et de répétitions s'adapte à la taille du muscle (gros : pecs, dos · petits : biceps, triceps).</p>
    </div>

    <div class="card">
      <label class="l" style="margin-top:0">1. Tes jours d'entraînement (${gd.length} séances / sem.)</label>
      <div class="chips">${DN.map((d, i) => chip(gd.includes(i), "obDay", { d: i }, d, "sq")).join("")}</div>
      <p class="hint" style="margin-top:6px">Repos fixe par défaut : <b>${offDays.length ? offDays.join(", ") : "Aucun"}</b> (jamais planifié automatiquement).</p>

      <label class="l">2. Temps habituel à la salle</label>
      <div class="chips">${DURATIONS.map((m) => chip(dur === m, "obDur", { m }, m + " min")).join("")}</div>
      <p class="hint" style="margin-top:8px">À <b>${dur} min</b> : ${tpx.c1} + ${tpx.c2} exercices par séance (2 ou 3 exos par muscle selon le temps).</p>

      <label class="l">3. Muscles haut du corps prioritaires (optionnel)</label>
      <div class="chips">${MUSCLES.map((m) => chip(pr.includes(m), "obPrio", { m }, MFR[m])).join("")}</div>

      <label class="l">4. Objectif principal</label>
      <div class="chips">
        ${chip(g === "hyper", "obGoal", { g: "hyper" }, "Hypertrophie")}
        ${chip(g === "force", "obGoal", { g: "force" }, "Force")}
        ${chip(g === "endu", "obGoal", { g: "endu" }, "Endurance")}
      </div>
      <div style="margin-top:12px">${profileTable()}</div>
    </div>

    <button class="btn primary block" data-act="finishOb">Valider et accéder au programme</button>
  </div>`;
      }

      /* ============ Vues ============ */
      function weekChips(wk, P) {
        return `<div class="chips">${MUSCLES.map((m) => chip(P.prio.includes(m), "wPrio", { wk, m }, MFR[m])).join("")}</div>`;
      }

      function durationSelector(dur, act, extraData = {}) {
        return `<div class="chips">${DURATIONS.map((m) =>
          chip(dur === m, act, Object.assign({}, extraData, { m }), m + "m")
        ).join("")}</div>`;
      }

      function todayCard(P) {
        const t = today(),
          inf = P.info[t];
        if (S.active) {
          const est = estimateMinutes(S.active.exercises);
          return `<div class="card hl">
      <div class="row between">
        <div><span class="tag acc">Séance en cours</span><h2 style="margin:6px 0 2px">${esc(S.active.name)}</h2>
        <div class="small mut">${S.active.exercises.length} exos · ${totalSetsOf(S.active.exercises)} séries · ~${est} min</div></div>
      </div>
      <div class="gap"></div>
      <button class="btn primary block" data-act="tab" data-t="workout">Reprendre la séance</button>
    </div>`;
        }
        if (inf.logs.length) {
          const l = inf.logs[inf.logs.length - 1];
          return `<div class="card">
      <span class="tag ok">Séance terminée ✓</span>
      <h2 style="margin:6px 0 4px">${esc(l.name)}</h2>
      <p class="mut small">${l.exercises.length} exercices · ${totalSetsOf(l.exercises)} séries · ${Math.round(vol(l))} kg soulevés${l.durationMin ? ` · ${l.durationMin} min` : ""}</p>
      <div class="row" style="margin-top:10px">
        <button class="btn sm" data-act="dayModal" data-d="${t}">Voir le détail</button>
        <button class="btn sm ghost" data-act="tab" data-t="workout">Nouvelle séance libre</button>
      </div>
    </div>`;
        }
        if (inf.blocked) {
          return `<div class="card">
      <span class="tag bad">Jour bloqué</span>
      <h2 style="margin:6px 0 4px">Repos / Indisponible</h2>
      <p class="mut small">Aucune séance prévue aujourd'hui.</p>
      <button class="btn sm" style="margin-top:8px" data-act="toggleBlock" data-d="${t}">Libérer cette journée</button>
    </div>`;
        }

        const dayDur = S.dayDur[t] || P.dur;
        let title = "",
          muscles = [],
          items = [],
          slotIdx = null;
        if (inf.customPair) {
          const [m1, m2] = inf.customPair;
          muscles = [m1, m2];
          title = `${MFR[m1]} & ${MFR[m2]}`;
          items = customPairExercises(m1, m2, dayDur);
        } else if (inf.slot != null && P.slots[inf.slot]) {
          const s = P.slots[inf.slot];
          slotIdx = s.idx;
          muscles = s.muscles;
          title = s.name;
          items = slotExercises(s, dayDur);
        }

        if (title) {
          const tp = timePlan(dayDur, S.settings.goal, S.settings.exPerMuscle, muscles);
          const built = buildItems(items);
          const est = estimateMinutes(built);
          const tot = totalSetsOf(built);
          const rows = items
            .map((it) => {
              const pr = prescribe(it.e, it.tp, it.rank);
              return `<div class="exrow" style="padding:6px 0">
          <span class="tag ${it.e.m === muscles[0] ? "acc" : "blue"}">${esc(MSHORT[it.e.m])}</span>
          <span class="grow small"><b>${esc(it.e.n)}</b> <span class="mut">· ${pr.sets} × ${repsTxt(pr.reps)}</span></span>
          <button class="btn sm ghost" data-act="swapModal" data-id="${it.e.id}" data-orig="${it.orig}" title="Remplacer l'exercice">⇄</button>
        </div>`;
            })
            .join("");
          return `<div class="card hl">
      <div class="row between wrapx">
        <div>
          <span class="tag acc">Aujourd'hui · 2 muscles</span>
          <h2 style="margin:6px 0 2px">${esc(title)}</h2>
          <div class="small mut">${MFR[muscles[0]]} (${tp.c1} exos) + ${MFR[muscles[1]]} (${tp.c2} exos) · <b>${tot} séries</b></div>
        </div>
        <button class="btn sm ghost" data-act="dayModal" data-d="${t}">Changer</button>
      </div>

      <div class="timebox">
        <div class="row between" style="margin-bottom:8px">
          <span class="tiny mut" style="font-weight:700;text-transform:uppercase;letter-spacing:.05em">Temps à la salle</span>
          <span class="tval">~${est} min <span class="tiny mut" style="font-family:Inter,sans-serif;font-weight:500">(cible ${dayDur} min · ${tot} séries)</span></span>
        </div>
        ${durationSelector(dayDur, "setDayDur", { d: t })}
      </div>

      <div style="margin:10px 0">${rows}</div>

      <button class="btn primary block" data-act="${slotIdx != null ? "startSlot" : "startCustomDay"}" data-wk="${P.wk}" data-idx="${slotIdx ?? ""}" data-d="${t}">Démarrer la séance (~${est} min)</button>
    </div>`;
        }

        const nextSlot = P.slots.find((s) => !S.logs.some((l) => l.weekKey === P.wk && l.slot === s.idx));
        return `<div class="card">
    <span class="tag">${inf.defaultRest ? "Repos fixe par défaut" : "Repos planifié"}</span>
    <h2 style="margin:6px 0 4px">Pas de séance prévue aujourd'hui</h2>
    <p class="mut small">${
      inf.defaultRest
        ? "Ce jour fait partie de tes jours de repos habituels."
        : "Tu peux avancer une séance de la semaine ou lancer une séance 2 muscles sur mesure."
    }</p>
    <div class="row wrapx" style="margin-top:10px">
      ${
        nextSlot
          ? `<button class="btn primary grow" data-act="startSlot" data-wk="${P.wk}" data-idx="${nextSlot.idx}">Faire ${esc(nextSlot.name)}</button>`
          : ""
      }
      <button class="btn grow" data-act="tab" data-t="workout">Séance 2 muscles libre</button>
    </div>
  </div>`;
      }

      function renderHome() {
        const t = today(),
          wk = wkOf(t),
          P = planWeek(wk),
          st = stats();
        const activeDaysTxt = S.settings.gymDays.map((i) => DN[i]).join(" · ");
        return `<div class="wrap">
    <div class="top">
      <div>
        <div class="sub">${fmtDay(t)}</div>
        <h1>Haut du corps</h1>
      </div>
      ${st.streak ? `<span class="tag acc">🔥 ${st.streak} sem.</span>` : ""}
    </div>

    ${!persistOK ? '<div class="card" style="border-color:var(--warn)"><p class="small">⚠️ Sauvegarde locale indisponible dans ce navigateur.</p></div>' : ""}

    ${todayCard(P)}

    <div class="tiles">
      <div class="tile"><b>${st.month}</b><span>Séances ce mois</span></div>
      <div class="tile"><b>${st.wvol >= 1000 ? Math.round(st.wvol / 100) / 10 + "t" : Math.round(st.wvol) + "kg"}</b><span>Volume semaine</span></div>
      <div class="tile"><b>${P.done}/${P.n}</b><span>Objectif semaine</span></div>
    </div>

    <div class="card">
      <div class="row between" style="margin-bottom:6px">
        <h2 style="margin:0">Programme de la semaine</h2>
        <div class="row" style="gap:6px">
          <button class="btn sm" data-act="wN" data-wk="${wk}" data-d="-1" aria-label="Moins une séance">−</button>
          <span class="small"><b>${P.n}</b> séances</span>
          <button class="btn sm" data-act="wN" data-wk="${wk}" data-d="1" aria-label="Plus une séance">+</button>
        </div>
      </div>

      <div class="row between" style="margin-bottom:10px;padding:6px 8px;background:var(--s2);border-radius:9px">
        <span class="tiny mut">Jours autorisés : <b style="color:var(--text)">${esc(activeDaysTxt)}</b></span>
        <button class="btn sm ghost" style="min-height:28px;padding:2px 8px;font-size:12px" data-act="daysModal">Modifier</button>
      </div>

      <div style="margin-bottom:10px">
        <div class="tiny mut" style="margin-bottom:5px;font-weight:600">DURÉE CIBLE DE LA SEMAINE : <b style="color:var(--acc)">${P.dur} MIN</b></div>
        ${durationSelector(P.dur, "wDur", { wk })}
      </div>

      <div>
        ${P.days
          .map((d, i) => {
            const inf = P.info[d];
            const isT = d === t;
            let stCls = "",
              stIcon = "—",
              lbl = "Repos",
              sub = "",
              rowCls = "";
            if (inf.logs.length) {
              const l = inf.logs[inf.logs.length - 1];
              stCls = "done";
              stIcon = "✓";
              lbl = l.name;
              sub = `Terminée · ${totalSetsOf(l.exercises)} séries`;
            } else if (inf.blocked) {
              stCls = "blocked";
              stIcon = "✕";
              lbl = "Indisponible";
            } else if (inf.customPair) {
              stCls = "plan";
              stIcon = "•";
              lbl = `${MFR[inf.customPair[0]]} & ${MFR[inf.customPair[1]]}`;
              const dd = S.dayDur[d] || P.dur;
              sub = `Épinglée · ${dd} min`;
            } else if (inf.slot != null && P.slots[inf.slot]) {
              const s = P.slots[inf.slot];
              stCls = "plan";
              stIcon = "•";
              lbl = s.name;
              const dd = S.dayDur[d] || P.dur;
              const tp = timePlan(dd, S.settings.goal, S.settings.exPerMuscle, s.muscles);
              sub = `${tp.c1}+${tp.c2} exos · ${tp.totalSets} séries · ${dd} min`;
            } else if (inf.missed) {
              stIcon = "!";
              lbl = "Séance passée";
            } else if (inf.defaultRest) {
              lbl = "Repos (par défaut)";
              rowCls = "rest-fixed";
            }
            return `<button class="day ${isT ? "today" : ""} ${rowCls}" data-act="dayModal" data-d="${d}">
            <div class="dn">${DN[i]}</div>
            <div class="st ${stCls}">${stIcon}</div>
            <div class="grow">
              <div style="font-weight:600">${esc(lbl)}</div>
              ${sub ? `<div class="tiny mut">${esc(sub)}</div>` : ""}
            </div>
            <span class="mut small">›</span>
          </button>`;
          })
          .join("")}
      </div>

      ${
        P.unplaced.length
          ? `<p class="tiny mut" style="margin-top:8px">ℹ️ ${P.unplaced.length} séance(s) de début de semaine déjà passée(s) — tes jours de repos fixes restent préservés.</p>`
          : ""
      }

      <label class="l">Priorités haut du corps (cette semaine)</label>
      ${weekChips(wk, P)}
    </div>
  </div>`;
      }

      function renderCal() {
        const [y, m] = ui.month.split("-").map(Number);
        const first = new Date(y, m - 1, 1);
        const start = monday(first);
        const t = today();
        const title = cap(first.toLocaleDateString("fr-FR", { month: "long", year: "numeric" }));
        const weeks = {};
        const cells = [];
        for (let i = 0; i < 42; i++) {
          const d = addDays(start, i),
            ds = ymd(d),
            wk = wkOf(ds);
          if (!weeks[wk]) weeks[wk] = planWeek(wk);
          const P = weeks[wk],
            inf = P.info[ds];
          const other = d.getMonth() !== m - 1;
          let cls = other ? "other" : "";
          if (ds === t) cls += " today";
          let lbl = "";
          if (inf.logs.length) {
            cls += " done";
            lbl = inf.logs[inf.logs.length - 1].name;
          } else if (inf.blocked) {
            cls += " blocked";
            lbl = "Bloqué";
          } else if (inf.customPair) {
            cls += " plan";
            lbl = `${MSHORT[inf.customPair[0]]}/${MSHORT[inf.customPair[1]]}`;
          } else if (inf.slot != null && P.slots[inf.slot]) {
            cls += " plan";
            lbl = P.slots[inf.slot].short;
          } else if (inf.missed) {
            cls += " missed";
            lbl = "Passée";
          } else if (inf.defaultRest) {
            cls += " rest-fixed";
          }
          cells.push(`<button class="cell ${cls}" data-act="dayModal" data-d="${ds}">
      <span class="n">${d.getDate()}</span>
      ${lbl ? `<span class="l">${esc(lbl)}</span>` : ""}
    </button>`);
        }
        return `<div class="wrap">
    <div class="top">
      <div><div class="sub">Planning & historique</div><h1>${esc(title)}</h1></div>
      <div class="row" style="gap:6px">
        <button class="btn sm" data-act="calNav" data-d="-1" aria-label="Mois précédent">‹</button>
        <button class="btn sm" data-act="calNow">Auj.</button>
        <button class="btn sm" data-act="calNav" data-d="1" aria-label="Mois suivant">›</button>
      </div>
    </div>
    <div class="cal">
      ${DN.map((d) => `<div class="h">${d}</div>`).join("")}
      ${cells.join("")}
    </div>
    <div class="legend">
      <span><i style="background:var(--ok)"></i>Terminée</span>
      <span><i style="background:var(--acc)"></i>Prévue (2 muscles)</span>
      <span><i style="background:var(--bad)"></i>Indisponible</span>
      <span><i style="background:#121519;border:1px solid var(--line)"></i>Repos fixe</span>
    </div>
  </div>`;
      }

      function renderWorkout() {
        if (S.active) {
          const W = S.active;
          const muscles = W.muscles || [...new Set(W.exercises.map((x) => x.m))];
          const totalSets = totalSetsOf(W.exercises);
          const doneSets = W.exercises.reduce((a, x) => a + x.sets.filter((s) => s.done).length, 0);
          const remEx = W.exercises
            .map((x) => ({ ...x, sets: x.sets.filter((s) => !s.done) }))
            .filter((x) => x.sets.length);
          const remMins = estimateMinutes(remEx);
          const fullEst = estimateMinutes(W.exercises);

          return `<div class="wrap">
      <div class="top">
        <div>
          <span class="tag acc">2 muscles · séries adaptées</span>
          <h1 style="margin-top:4px">${esc(W.name)}</h1>
          <div class="small mut">Chrono : <b id="elapsed" style="color:var(--text)">${mmss((Date.now() - W.startedAt) / 1000)}</b> · ${doneSets}/${totalSets} séries · Reste ~${remMins} min</div>
        </div>
        <button class="btn sm danger" data-act="cancelW">Quitter</button>
      </div>

      <div class="timebox" style="margin-top:0">
        <div class="row between" style="margin-bottom:6px">
          <span class="tiny mut" style="font-weight:700;text-transform:uppercase">Adapter au temps à la salle (cible : ${W.targetDur || S.settings.duration} min · total ~${fullEst} min)</span>
        </div>
        ${durationSelector(W.targetDur || S.settings.duration, "adaptW")}
      </div>

      ${muscles
        .map((m, mi) => {
          const mEx = W.exercises.map((x, idx) => ({ x, idx })).filter((o) => o.x.m === m);
          if (!mEx.length) return "";
          return `<div class="mhead">
          <b>${mi + 1}. ${esc(MFR[m] || m)} <span class="tiny mut" style="font-family:Inter,sans-serif;text-transform:none;font-weight:500">· ${esc(PROFILE[m]?.label || "")}</span></b>
          <span class="tiny mut">${mEx.length} exo${mEx.length > 1 ? "s" : ""} · ${totalSetsOf(mEx.map((o) => o.x))} séries</span>
        </div>
        ${mEx.map(({ x, idx }) => renderExCard(x, idx)).join("")}`;
        })
        .join("")}

      ${W.exercises
        .filter((x) => !muscles.includes(x.m))
        .map((x) => renderExCard(x, W.exercises.indexOf(x)))
        .join("")}

      <div class="row" style="margin:12px 0">

      function renderProgress() {

      function renderChart(pts, metric) {
        const W = 640,
          H = 200,
          P = 34;
        const vals = pts.map((p) => p[metric]);
        let min = Math.min(...vals),
          max = Math.max(...vals);
        if (min === max) {
          min = Math.max(0, min - 5);
          max += 5;
        }
        const padY = (max - min) * 0.12;
        min = Math.max(0, min - padY);
        max += padY;
        const xAt = (i) => (pts.length === 1 ? W / 2 : P + (i * (W - 2 * P)) / (pts.length - 1));
        const yAt = (v) => H - P - ((v - min) / (max - min)) * (H - 2 * P);
        const poly = pts.map((p, i) => `${xAt(i)},${yAt(p[metric])}`).join(" ");
        return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Graphique de progression">
    <line x1="${P}" y1="${P}" x2="${W - P}" y2="${P}" stroke="var(--line)" stroke-dasharray="3 3"/>
    <line x1="${P}" y1="${H / 2}" x2="${W - P}" y2="${H / 2}" stroke="var(--line)" stroke-dasharray="3 3"/>
    <line x1="${P}" y1="${H - P}" x2="${W - P}" y2="${H - P}" stroke="var(--line)"/>
    <text x="4" y="${P + 4}">${nf(max)}</text>
    <text x="4" y="${H / 2 + 4}">${nf((max + min) / 2)}</text>
    <text x="4" y="${H - P + 4}">${nf(min)}</text>
    ${
      pts.length > 1
        ? `<polyline fill="none" stroke="var(--acc)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="${poly}"/>`
        : ""
    }
    ${pts
      .map(
        (p, i) => `
      <circle cx="${xAt(i)}" cy="${yAt(p[metric])}" r="5" fill="var(--acc)"/>
      <text x="${xAt(i)}" y="${H - 10}" text-anchor="middle">${fmtShort(p.date)}</text>
    `
      )
      .join("")}
  </svg>`;
      }

      function render() {

          $("#app").innerHTML = renderOnboarding();

          return;
        }
        $("nav").hidden = false;
        ["home", "cal", "workout", "progress", "settings"].forEach((t) => {

          if (b) b.classList.toggle("on", ui.tab === t);
        });
        $("#app").innerHTML =
          ui.tab === "home"
            ? renderHome()
            : ui.tab === "cal"
            ? renderCal()
            : ui.tab === "workout"
            ? renderWorkout()
            : ui.tab === "progress"
            ? renderProgress()
            : renderSettings();
        tick();
      }

      document.addEventListener("click", (e) => {
        const el = e.target.closest("[data-act]");
        if (!el) return;
        const act = el.dataset.act;

        if (act === "bg" && e.target === el) {
          closeModal();
          return;
        }
        if (act === "close") {
          closeModal();
          return;
        }
        if (act === "tab") {
          ui.tab = el.dataset.t;
          render();
          window.scrollTo(0, 0);
          return;
        }

        /* Onboarding */
        if (act === "obDay") {
          const d = Number(el.dataset.d);
          const a = S.settings.gymDays;
          S.settings.gymDays = a.includes(d)
            ? a.length > 1
              ? a.filter((x) => x !== d)
              : a
            : [...a, d].sort((x, y) => x - y);
          render();
          return;
        }
        if (act === "obDur") {
          S.settings.duration = Number(el.dataset.m);
          render();
          return;
        }
        if (act === "obPrio") {
          const m = el.dataset.m,
            a = S.settings.priority;
          S.settings.priority = a.includes(m) ? a.filter((x) => x !== m) : [...a, m];
          render();
          return;
        }
        if (act === "obGoal") {
          S.settings.goal = el.dataset.g;
          render();
          return;
        }
        if (act === "finishOb") {
          S.onboarded = true;
          save();
          render();
          return;
        }

        /* Semaine & Durée */
        if (act === "wN") {
          const wk = el.dataset.wk;
          const strict = S.settings.strictDays !== false;
          const maxAllowed = strict ? S.settings.gymDays.length : 6;
          const cur = S.weekN[wk] ?? S.settings.gymDays.length;
          const next = cur + Number(el.dataset.d);
          if (strict && next > maxAllowed) {
            toast(`Maximum ${maxAllowed} séances avec tes jours autorisés (modifie tes jours pour plus).`);
            return;
          }
          S.weekN[wk] = Math.max(1, Math.min(maxAllowed, next));
          save();
          render();
          return;
        }
        if (act === "daysModal") {
          openDaysModal();
          return;
        }
        if (act === "setDayModal") {
          const d = Number(el.dataset.d),
            a = S.settings.gymDays;
          S.settings.gymDays = a.includes(d)
            ? a.length > 1
              ? a.filter((x) => x !== d)
              : a
            : [...a, d].sort((x, y) => x - y);
          delete S.weekN[wkOf(today())];
          save();
          openDaysModal();
          render();
          return;
        }
        if (act === "wDur") {
          const wk = el.dataset.wk;
          S.weekDur[wk] = Number(el.dataset.m);
          save();
          render();
          return;
        }
        if (act === "setDayDur") {
          const d = el.dataset.d;
          S.dayDur[d] = Number(el.dataset.m);
          save();
          render();
          return;
        }
        if (act === "setDayDurModal") {
          const d = el.dataset.d;
          S.dayDur[d] = Number(el.dataset.m);
          save();
          openDayModal(d);
          render();
          return;
        }
        if (act === "wPrio") {
          const wk = el.dataset.wk,
            m = el.dataset.m;
          const cur = S.weekPrio[wk] ?? [...S.settings.priority];
          S.weekPrio[wk] = cur.includes(m) ? cur.filter((x) => x !== m) : [...cur, m];
          save();
          render();
          return;
        }

        /* Lancement séances */
        if (act === "startSlot") {
          startSlot(el.dataset.wk, Number(el.dataset.idx), el.dataset.d || today());
          return;
        }
        if (act === "startSlotClose") {
          closeModal();
          startSlot(el.dataset.wk, Number(el.dataset.idx), el.dataset.d || today());
          return;
        }
        if (act === "startCustomDay" || act === "startCustomDayClose") {
          const d = el.dataset.d || today(),
            P = planWeek(wkOf(d)),
            pair = P.info[d]?.customPair;
          if (act === "startCustomDayClose") closeModal();
          if (pair) startCustomPair(pair[0], pair[1], S.dayDur[d] || P.dur, d, wkOf(d));
          return;
        }

        /* Séance libre 2 muscles */
        if (act === "freeMuscle") {
          const m = el.dataset.m;
          let a = [...ui.free.muscles];
          if (a.includes(m)) a = a.filter((x) => x !== m);
          else {
            if (a.length >= 2) a.shift();
            a.push(m);
          }
          ui.free.muscles = a;
          render();
          return;
        }
        if (act === "freeDur") {
          ui.free.dur = Number(el.dataset.m);
          render();
          return;
        }
        if (act === "startFree") {
          if (ui.free.muscles.length === 2) {
            startCustomPair(ui.free.muscles[0], ui.free.muscles[1], ui.free.dur);
          }
          return;
        }

        /* Séance active */
        if (act === "adaptW") {
          adaptActiveDuration(Number(el.dataset.m));
          return;
        }
        if (act === "togSet") {
          const ei = Number(el.dataset.ei),
            si = Number(el.dataset.si);
          const ex = S.active.exercises[ei],
            st = ex.sets[si];
          st.done = !st.done;
          if (st.done) {
            if (!st.r) st.r = String(ex.reps[0]);
            startTimer(ex.rest, `${ex.name} — Série ${si + 1}/${ex.sets.length}`);
          }
          save();
          render();
          return;
        }
        if (act === "swapModal") {
          openSwapModal(el.dataset.id, el.dataset.orig, null);
          return;
        }
        if (act === "swapActiveModal") {
          const ei = Number(el.dataset.ei),
            ex = S.active.exercises[ei];
          openSwapModal(ex.id, ex.orig, ei);
          return;
        }
        if (act === "doSwapDefault") {
          S.swaps[el.dataset.orig] = el.dataset.to;
          save();
          closeModal();
          toast("Exercice remplacé");
          render();
          return;
        }
        if (act === "doSwapActive") {
          const ei = Number(el.dataset.ei),
            ne = EXI[el.dataset.to];
          if (S.active && ne) {
            const tp = timePlan(
              S.active.targetDur || S.settings.duration,
              S.settings.goal,
              S.settings.exPerMuscle,
              S.active.muscles
            );
            const rank = S.active.exercises[ei].rank || 0;
            S.active.exercises[ei] = buildEx(ne, el.dataset.orig, tp, rank);
            save();
            closeModal();
            toast(`Remplacé par ${ne.n}`);
            render();
          }
          return;
        }
        if (act === "remActiveEx") {
          const ei = Number(el.dataset.ei);
          S.active.exercises.splice(ei, 1);
          save();
          render();
          return;
        }
        if (act === "addExModal") {
          ui.addM = el.dataset.m || "pecs";
          openAddExModal(ui.addM);
          return;
        }
        if (act === "filterAddM") {
          ui.addM = el.dataset.m;
          openAddExModal(ui.addM);
          return;
        }
        if (act === "doAddEx") {
          const ne = EXI[el.dataset.id];
          if (S.active && ne) {
            const tp = timePlan(
              S.active.targetDur || S.settings.duration,
              S.settings.goal,
              S.settings.exPerMuscle,
              S.active.muscles
            );
            const rank = S.active.exercises.filter((x) => x.m === ne.m).length;
            const nx = buildEx(ne, ne.id, tp, rank);
            S.active.exercises.push(nx);
            save();
            closeModal();
            toast(`${ne.n} ajouté (${nx.sets.length} séries × ${repsTxt(nx.reps)})`);
            render();
          }
          return;
        }
        if (act === "finishW") {
          const W = S.active;
          const clean = W.exercises
            .map((x) => ({
              id: x.id,
              name: x.name,
              m: x.m,
              sets: x.sets
                .filter((s) => s.done || num(s.r) > 0)
                .map((s) => ({ w: num(s.w), r: Math.max(1, Math.round(num(s.r) || x.reps[0])) })),
            }))
            .filter((x) => x.sets.length);
          if (!clean.length) {
            toast("Valide au moins une série avant de terminer");
            return;
          }
          const durationMin = Math.max(1, Math.round((Date.now() - W.startedAt) / 60000));
          S.logs.push({
            id: W.id,
            date: W.date,
            weekKey: W.weekKey,
            slot: W.slot,
            name: W.name,
            muscles: W.muscles,
            durationMin,
            exercises: clean,
          });
          S.active = null;
          S.timer = null;
          save();
          ui.tab = "home";
          toast("Séance enregistrée ! Bravo 💪");
          render();
          return;
        }
        if (act === "cancelW") {
          confirmM("Abandonner la séance en cours sans enregistrer ?", "doCancelW");
          return;
        }
        if (act === "doCancelW") {
          S.active = null;
          S.timer = null;
          save();
          closeModal();
          render();
          return;
        }

        /* Calendrier & Modale Jour */
        if (act === "calNav") {
          const [y, m] = ui.month.split("-").map(Number);
          const d = new Date(y, m - 1 + Number(el.dataset.d), 1);
          ui.month = ymd(d).slice(0, 7);
          render();
          return;
        }
        if (act === "calNow") {
          ui.month = today().slice(0, 7);
          render();
          return;
        }
        if (act === "dayModal") {
          openDayModal(el.dataset.d);
          return;
        }
        if (act === "pinPair") {
          const d = el.dataset.d;
          S.customPins[d] = [el.dataset.m1, el.dataset.m2];
          delete S.pins[d];
          save();
          openDayModal(d);
          render();
          return;
        }
        if (act === "toggleBlock") {
          const d = el.dataset.d;
          if (S.blocked[d]) delete S.blocked[d];
          else {
            S.blocked[d] = true;
            delete S.pins[d];
            delete S.customPins[d];
          }
          save();
          if (!$("#modal").hidden) openDayModal(d);
          render();
          return;
        }

        /* Progrès */
        if (act === "metric") {
          ui.metric = el.dataset.m;
          render();
          return;
        }
        if (act === "addBw") {
          const v = num($("#bw-in").value);
          if (v > 20 && v < 300) {
            S.body.push({ date: today(), w: v });
            save();
            toast("Poids enregistré");
            render();
          }
          return;
        }
        if (act === "delLog") {
          confirmM("Supprimer définitivement cette séance de l’historique ?", "doDelLog", { id: el.dataset.id });
          return;
        }
        if (act === "doDelLog") {
          S.logs = S.logs.filter((l) => l.id !== el.dataset.id);
          save();
          closeModal();
          render();
          return;
        }

        /* Réglages */
        if (act === "setDur") {
          S.settings.duration = Number(el.dataset.m);
          save();
          render();
          return;
        }
        if (act === "setExMode") {
          S.settings.exPerMuscle = el.dataset.v;
          save();
          render();
          return;
        }
        if (act === "setDay") {
          const d = Number(el.dataset.d),
            a = S.settings.gymDays;
          S.settings.gymDays = a.includes(d)
            ? a.length > 1
              ? a.filter((x) => x !== d)
              : a
            : [...a, d].sort((x, y) => x - y);
          delete S.weekN[wkOf(today())];
          save();
          render();
          return;
        }
        if (act === "setStrict") {
          S.settings.strictDays = el.dataset.v === "1";
          delete S.weekN[wkOf(today())];
          save();
          render();
          return;
        }
        if (act === "setSplit") {
          S.settings.split = el.dataset.v;
          save();
          render();
          return;
        }
        if (act === "setPrio") {
          const m = el.dataset.m,
            a = S.settings.priority;
          S.settings.priority = a.includes(m) ? a.filter((x) => x !== m) : [...a, m];
          save();
          render();
          return;
        }
        if (act === "setGoal") {
          S.settings.goal = el.dataset.g;
          save();
          render();
          return;
        }
        if (act === "exportJson") {
          const blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = `muscu-log-haut-${today()}.json`;
          a.click();
          return;
        }
        if (act === "importModal") {
          modal(`<h3>Importer une sauvegarde</h3><textarea id="imp-txt" placeholder="Colle ici le contenu du fichier JSON..."></textarea>
    <div class="row" style="margin-top:10px"><button class="btn grow" data-act="close">Annuler</button><button class="btn primary grow" data-act="doImport">Importer</button></div>`);
          return;
        }
        if (act === "doImport") {
          try {
            const o = JSON.parse($("#imp-txt").value);
            if (o && o.settings) {
              S = Object.assign(fresh(), o);
              save();
              closeModal();
              toast("Sauvegarde importée");
              render();
            }
          } catch (err) {
            toast("JSON invalide");
          }
          return;
        }
        if (act === "resetConfirm") {
          confirmM("Effacer toutes les données et recommencer à zéro ?", "doReset");
          return;
        }
        if (act === "doReset") {
          localStorage.removeItem(KEY);
          S = fresh();
          closeModal();
          render();
          return;
        }

        /* Minuteur */
        if (act === "tAdj" && S.timer) {
          S.timer.end += Number(el.dataset.d) * 1000;
          S.timer.total = Math.max(15, S.timer.total + Number(el.dataset.d));
          S.timer.fired = false;
          save();
          tick();
          return;
        }
        if (act === "tStop") {
          S.timer = null;
          save();
          tick();
          return;
        }
      });

      document.addEventListener("input", (e) => {
        if (e.target.dataset.set && S.active) {
          const ei = Number(e.target.dataset.ei),
            si = Number(e.target.dataset.si),
            k = e.target.dataset.set;
          S.active.exercises[ei].sets[si][k] = e.target.value;
          save();
        }
      });

      document.addEventListener("change", (e) => {
        if (e.target.dataset.act === "progEx") {
          ui.progEx = e.target.value;
          render();
        }
      });

      render();
    </script>
  </body>
</html>
